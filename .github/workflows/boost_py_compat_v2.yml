name: boost-python-compat

# Builds Boost.Python from source against a matrix of Python versions
# and runs a minimal embed smoke test. Fixed OS + compiler for now —
# add those as matrix axes later once this baseline works.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/boost-python-compat.yml"

env:
  BOOST_VERSION: "1.85.0"

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ wget

      - name: Report toolchain
        id: toolchain
        run: |
          echo "python_path=$(which python3)" >> "$GITHUB_OUTPUT"
          python3 --version
          g++ --version
          echo "python3-config includes: $(python3-config --includes)"

      - name: Download Boost ${{ env.BOOST_VERSION }} source
        run: |
          BOOST_UNDERSCORE=$(echo "$BOOST_VERSION" | tr '.' '_')
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"
          tar xzf "boost_${BOOST_UNDERSCORE}.tar.gz"
          echo "BOOST_DIR=boost_${BOOST_UNDERSCORE}" >> "$GITHUB_ENV"

      - name: Bootstrap Boost (target this Python)
        id: bootstrap
        working-directory: ${{ env.BOOST_DIR }}
        continue-on-error: true
        run: |
          ./bootstrap.sh --with-python=$(which python3) --with-libraries=python

      - name: Build Boost.Python
        id: boost_build
        if: steps.bootstrap.outcome == 'success'
        working-directory: ${{ env.BOOST_DIR }}
        continue-on-error: true
        run: |
          ./b2 --with-python variant=release link=shared threading=multi -j$(nproc)

      - name: Write embed smoke test
        run: |
          cat > test_embed.cpp << 'EOF'
          #include <boost/python.hpp>
          namespace py = boost::python;

          int main() {
              Py_Initialize();
              try {
                  py::object main_module = py::import("__main__");
                  py::object main_namespace = main_module.attr("__dict__");
                  py::exec("result = 2 + 2\nprint('boost.python says:', result)", main_namespace);
                  int result = py::extract<int>(main_namespace["result"]);
                  if (result != 4) { return 2; }
              } catch (py::error_already_set&) {
                  PyErr_Print();
                  return 1;
              }
              Py_Finalize();
              return 0;
          }
          EOF

      - name: Compile smoke test
        id: compile
        if: steps.boost_build.outcome == 'success'
        run: |
          PYTAG=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          BOOST_STAGE="${BOOST_DIR}/stage/lib"
          echo "boost_stage=${BOOST_STAGE}" >> "$GITHUB_OUTPUT"
          g++ test_embed.cpp -o test_embed \
            -I"${BOOST_DIR}" \
            $(python3-config --includes) \
            -L"${BOOST_STAGE}" \
            -lboost_python${PYTAG} \
            $(python3-config --ldflags --embed 2>/dev/null || python3-config --ldflags) \
            -Wl,-rpath,"$(pwd)/${BOOST_STAGE}"

      - name: Run smoke test
        id: run
        if: steps.compile.outcome == 'success'
        run: ./test_embed

      - name: Record result
        if: always()
        run: |
          echo "python=${{ matrix.python-version }}"                  >> result.txt
          echo "boost=${BOOST_VERSION}"                                >> result.txt
          echo "bootstrap=${{ steps.bootstrap.outcome }}"              >> result.txt
          echo "boost_build=${{ steps.boost_build.outcome }}"          >> result.txt
          echo "compile=${{ steps.compile.outcome }}"                  >> result.txt
          echo "run=${{ steps.run.outcome }}"                          >> result.txt
          cat result.txt

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-python-${{ matrix.python-version }}
          path: result.txt

  # ---------------------------------------------------------------------
  # This job answers a different question than the one above.
  # build-and-test proves: "Boost.Python built against 3.X works when run
  # with 3.X." That's the easy case and it will basically always pass.
  #
  # cross-version-abi-test builds Boost.Python against one Python version
  # ("build_python") and then tries to import the resulting compiled
  # extension into a DIFFERENT Python version ("run_python") — i.e. the
  # exact situation someone hits when they already have a Boost.Python
  # built against one interpreter and try to use it with another. This
  # is expected to fail for most pairs; that's the point — it's here to
  # confirm *how* it fails (ImportError vs segfault vs silently wrong).
  # ---------------------------------------------------------------------
  cross-version-abi-test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_python: "3.9"
            run_python: "3.12"
          - build_python: "3.12"
            run_python: "3.9"
          - build_python: "3.10"
            run_python: "3.11"
          - build_python: "3.9"
            run_python: "3.13"

    steps:
      - name: Set up build Python ${{ matrix.build_python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.build_python }}

      - name: Record build Python path
        id: build_py
        run: echo "path=$(which python3)" >> "$GITHUB_OUTPUT"

      - name: Set up run Python ${{ matrix.run_python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.run_python }}

      - name: Record run Python path
        id: run_py
        run: echo "path=$(which python3)" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ wget

      - name: Download Boost ${{ env.BOOST_VERSION }} source
        run: |
          BOOST_UNDERSCORE=$(echo "$BOOST_VERSION" | tr '.' '_')
          wget -q "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${BOOST_UNDERSCORE}.tar.gz"
          tar xzf "boost_${BOOST_UNDERSCORE}.tar.gz"
          echo "BOOST_DIR=boost_${BOOST_UNDERSCORE}" >> "$GITHUB_ENV"

      - name: Bootstrap Boost against build_python only
        id: bootstrap
        working-directory: ${{ env.BOOST_DIR }}
        continue-on-error: true
        run: |
          ./bootstrap.sh --with-python="${{ steps.build_py.outputs.path }}" --with-libraries=python

      - name: Build Boost.Python
        id: boost_build
        if: steps.bootstrap.outcome == 'success'
        working-directory: ${{ env.BOOST_DIR }}
        continue-on-error: true
        run: |
          ./b2 --with-python variant=release link=shared threading=multi -j$(nproc)

      - name: Write extension module source
        run: |
          cat > ext_module.cpp << 'EOF'
          #include <boost/python.hpp>
          int add(int a, int b) { return a + b; }
          BOOST_PYTHON_MODULE(compat_ext) {
              boost::python::def("add", add);
          }
          EOF

      - name: Compile extension module against build_python
        id: compile
        if: steps.boost_build.outcome == 'success'
        continue-on-error: true
        run: |
          BUILD_PY="${{ steps.build_py.outputs.path }}"
          BUILD_PYTAG=$("$BUILD_PY" -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          BUILD_INC=$("$BUILD_PY" -c "import sysconfig; print(sysconfig.get_paths()['include'])")
          BUILD_LIBDIR=$("$BUILD_PY" -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          BOOST_STAGE="${BOOST_DIR}/stage/lib"
          echo "build_pytag=${BUILD_PYTAG}" >> "$GITHUB_OUTPUT"
          g++ -shared -fPIC ext_module.cpp -o compat_ext.so \
            -I"${BOOST_DIR}" -I"${BUILD_INC}" \
            -L"${BOOST_STAGE}" -lboost_python${BUILD_PYTAG} \
            -L"${BUILD_LIBDIR}" -lpython${BUILD_PYTAG} \
            -Wl,-rpath,"$(pwd)/${BOOST_STAGE}" \
            -Wl,-rpath,"${BUILD_LIBDIR}"

      - name: Attempt import with run_python (mismatched version)
        id: run
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        run: |
          PYTHONPATH=. "${{ steps.run_py.outputs.path }}" -c "import compat_ext; print('add(2,3) =', compat_ext.add(2,3))"

      - name: Record cross-version result
        if: always()
        run: |
          {
            echo "build_python=${{ matrix.build_python }}"
            echo "run_python=${{ matrix.run_python }}"
            echo "bootstrap=${{ steps.bootstrap.outcome }}"
            echo "boost_build=${{ steps.boost_build.outcome }}"
            echo "compile=${{ steps.compile.outcome }}"
            echo "run_import=${{ steps.run.outcome }}"
          } >> cross_result.txt
          cat cross_result.txt

      - name: Upload cross-version result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-result-build${{ matrix.build_python }}-run${{ matrix.run_python }}
          path: cross_result.txt
